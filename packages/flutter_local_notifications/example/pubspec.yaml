name: flutter_local_notifications_example
description: Demonstrates how to use the flutter_local_notifications_tizen plugin.
publish_to: "none"

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.0.0-dev.2
  flutter_local_notifications_tizen:
    path: ../
  timezone: ^0.11.0

dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  integration_test_tizen:
    path: ../../integration_test/

flutter:
  uses-material-design: true
